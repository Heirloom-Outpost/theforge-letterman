<meta name="description" content="Eight weeks of the foundations of 2D animation, drawn by hand in Blender's Grease Pencil, with an optional Toon Boom Harmony track. One module a week moves from a bouncing ball through drawing and timing, cycles, character and pose, sound and voice, and scene craft, to a final piece of 30 to 60 seconds that each student animates and voices. There are no grades and no tests to pass, and AI organizes the course and touches nothing a student makes.">

<!-- the marbling of the course's own cover art (decorative; its colours are the page's tokens) -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0"><defs>
  <filter id="lm-marble" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.016" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="95" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs></svg>
<div id="lm-status" class="sr-only" role="status" aria-live="polite"></div>
