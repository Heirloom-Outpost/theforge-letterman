<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270" role="img" aria-labelledby="t d">
<title id="t">Two rows of boxes for the first half second, 12 frames: on ones a new drawing in every frame; on twos each drawing held for two frames.</title>
<desc id="d">Two rows of 12 boxes, the first half second of film. The top row, on ones, shows a new drawing in every box, 1 to 12. The bottom row, on twos, shows each drawing twice: 1 1 2 2 up to 6 6. Over a full second that is 24 drawings on ones and 12 on twos.</desc>
