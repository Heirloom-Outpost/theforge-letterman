<title id="t">Three rows of 24 ticks between the same start and stop: heavy bunched in long eases at both ends with wide, even gaps in the middle; light nearly even with a short ease of two or three ticks at each end; even spacing marked mechanical.</title>
<desc id="d">Three horizontal lines, each with 24 ticks from the same start to the same stop. Heavy: ticks bunched in long eases at both ends, with wide, even gaps in the middle. Light: nearly even, with a short ease of two or three ticks at each end. Even: evenly spaced, labeled mechanical.</desc>
