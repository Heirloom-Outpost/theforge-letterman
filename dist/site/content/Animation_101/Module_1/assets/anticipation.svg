<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 298" width="420" height="298" role="img" aria-labelledby="t d">
<title id="t">A marker moves a short way back, then travels in a large arc forward.</title>
<desc id="d">A marker starts in the middle, moves a short way left (labeled back first), then travels in a large arc to the right (labeled then the action).</desc>
<rect width="420" height="298" fill="#ffffff"/>
<text x="12" y="26" font-size="16" fill="#222" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Anticipation: a small move the opposite</text><text x="12" y="46" font-size="16" fill="#222" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">way, before the big one</text><defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><line x1="12" y1="200" x2="408" y2="200" stroke="#c9c9c9" stroke-width="2"/><circle cx="150" cy="172" r="12" fill="#666"/><text x="150" y="222" font-size="13" fill="#666" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">start</text><path d="M 138 172 L 88 172" stroke="#b5452f" stroke-width="3" marker-end="url(#a2)"/><circle cx="78" cy="172" r="12" fill="#b5452f"/><text x="78" y="146" font-size="14" fill="#b5452f" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">1. back first</text><path d="M 90 166 Q 230 60 360 170" fill="none" stroke="#2f6db5" stroke-width="3" marker-end="url(#a1)"/><circle cx="372" cy="172" r="12" fill="#2f6db5"/><text x="300" y="92" font-size="14" fill="#2f6db5" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">2. then the action</text><text x="12" y="252" font-size="13" fill="#222" text-anchor="start"  font-family="Segoe UI, Helvetica, Arial, sans-serif">The audience watches the small move, and looks</text><text x="12" y="270" font-size="13" fill="#222" text-anchor="start"  font-family="Segoe UI, Helvetica, Arial, sans-serif">where the big one is about to go.</text>
<text x="410" y="290" text-anchor="end" font-size="11" fill="#666" font-family="Segoe UI, Helvetica, Arial, sans-serif">Diagram: Heirloom Estate Academy (estate-made teaching figure)</text>
</svg>
