<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" role="img" aria-labelledby="t d">
<title id="t">The reference bounce, one labeled dot per frame: the ball falls with growing gaps, touches the floor on frame 6, rises to a lower top on frame 9, and is back on the floor on frame 12.</title>
<desc id="d">Twelve dots, one per frame, each labeled with its height. The ball falls from 10 on frame 1 with gaps that grow each frame, touches the floor on frame 6, rises with shrinking gaps to a lower top on frame 9, and falls back to the floor on frame 12. Both contact frames are marked.</desc>
<rect width="420" height="440" fill="#ffffff"/>
<text x="12" y="24" font-size="16" fill="#222" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">One good answer: gaps grow as it falls,</text><text x="12" y="44" font-size="16" fill="#222" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">one lower hop, and it lands on frame 12</text>
