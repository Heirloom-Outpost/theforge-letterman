<title id="t">A spacing chart: twelve frame columns, heights 0 to 10, with twelve evenly spaced dots stepping from 10 down to 0, like an escalator.</title>
<desc id="d">A grid of 12 columns, one per frame, and heights from 0 (the floor) to 10 squares. 12 dots step down from 10 to 0 by the same amount every frame: the evenly spaced version.</desc>
