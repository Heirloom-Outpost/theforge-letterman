<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 510" width="420" height="510" role="img" aria-labelledby="t d">
<title id="t">Twelve drawings of the ball at their chart heights, each held for two frames: drawing 1 on frames 1 and 2, up to drawing 12 on frames 23 and 24. Drawings 6 and 12 touch the floor.</title>
<desc id="d">Twelve small balls, one per drawing, each drawn at its height from the chart, in two rows. The top row is the fall, drawings 1 to 6, ending on the floor. The bottom row is the hop and the landing, drawings 7 to 12, ending on the floor. Under each drawing are the two frames it covers: drawing 1 on frames 1 and 2, up to drawing 12 on frames 23 and 24. The contact drawings, 6 and 12, are marked.</desc>
<rect width="420" height="510" fill="#ffffff"/>
