<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" aria-labelledby="t d">
<title id="t">A stretched ball, a round ball and a squashed ball whose drawn areas are about the same; the squashed one touches the floor. Shorter means wider.</title>
<desc id="d">Three ball shapes above a floor line: a tall thin stretched ellipse while falling (30 wide, 54 tall), a round circle at the top (40 by 40), and a wide flat squashed ellipse touching the floor (58 wide, 28 tall). Their areas are nearly equal.</desc>
<rect width="420" height="324" fill="#ffffff"/>
<text x="12" y="26" font-size="16" fill="#222" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Squash and stretch: the shape changes,</text><text x="12" y="46" font-size="16" fill="#222" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">the amount of ball does not</text><line x1="12" y1="190" x2="408" y2="190" stroke="#222" stroke-width="3"/><ellipse cx="76" cy="100" rx="15" ry="27" fill="#2f6db5"/><text x="76" y="212" font-size="13" fill="#222" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">falling: stretch</text><text x="76" y="230" font-size="12" fill="#666" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">30 wide, 54 tall</text><ellipse cx="210" cy="118" rx="20" ry="20" fill="#2f6db5"/><text x="210" y="212" font-size="13" fill="#222" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">at the top</text><text x="210" y="230" font-size="12" fill="#666" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">40 wide, 40 tall</text><ellipse cx="344" cy="176" rx="29" ry="14" fill="#2f6db5"/><text x="344" y="212" font-size="13" fill="#222" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">contact: squash</text><text x="344" y="230" font-size="12" fill="#666" text-anchor="middle"  font-family="Segoe UI, Helvetica, Arial, sans-serif">58 wide, 28 tall</text><text x="12" y="260" font-size="13" fill="#222" text-anchor="start"  font-family="Segoe UI, Helvetica, Arial, sans-serif">The drawing's area stays about the same</text><text x="12" y="278" font-size="13" fill="#222" text-anchor="start"  font-family="Segoe UI, Helvetica, Arial, sans-serif">(width times height: 1620, 1600, 1624). Shorter means wider.</text><text x="12" y="296" font-size="13" fill="#222" text-anchor="start"  font-family="Segoe UI, Helvetica, Arial, sans-serif">And the squashed ball really touches the floor.</text>
<text x="410" y="316" text-anchor="end" font-size="11" fill="#666" font-family="Segoe UI, Helvetica, Arial, sans-serif">Diagram: Heirloom Estate Academy (estate-made teaching figure)</text>
</svg>
